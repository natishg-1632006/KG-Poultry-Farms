name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create ZIP Package
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/KG-Poultry-Farms-App.apk
          cd output && zip -r KG-Poultry-Farms-App.zip KG-Poultry-Farms-App.apk

      - name: Upload APK & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KG-Poultry-Farms-Android-APK
          path: |
            output/KG-Poultry-Farms-App.apk
            output/KG-Poultry-Farms-App.zip
          retention-days: 30
